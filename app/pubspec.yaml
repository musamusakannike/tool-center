name: tool_center
description: "Tool Center — a fast, lightweight, open-source desktop file toolbox."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_rust_bridge: 2.13.0
  file_picker: ^13.4.1
  desktop_drop: ^0.8.0
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
