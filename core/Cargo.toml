[workspace]
resolver = "2"
members = [
    "core-jobs",
    "core-image",
    "core-pdf",
    "core-media",
    "core-archive",
    "core-convert",
    "core-ai",
    "bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/musamusakannike/tool-center"

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "macros", "time", "process", "fs", "io-util"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
image = { version = "0.25", default-features = false, features = ["rayon", "avif", "bmp", "gif", "ico", "jpeg", "png", "tiff", "webp"] }
fast_image_resize = { version = "6.2", features = ["rayon"] }
oxipng = { version = "10.2", default-features = false, features = ["parallel", "zopfli"] }
mozjpeg-rs = "0.9"
img-parts = "0.4"
kamadak-exif = "0.6"
pdfium-render = { version = "0.9", features = ["pdfium_latest", "image_latest", "thread_safe"] }
lopdf = "0.47"
csv = "1.3"
zip = { version = "9.8", default-features = false, features = ["deflate-flate2", "aes-crypto", "zstd", "xz"] }
tar = "0.4"
flate2 = "1.1"
zstd = "0.14"
lzma-rust2 = { version = "0.26", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
sevenz-rust2 = { version = "0.27", default-features = false, features = ["compress", "aes256", "util"] }
walkdir = "2.5"
tempfile = "3.13"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
