name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flutter_target: linux
          - os: macos-latest
            flutter_target: macos
          - os: windows-latest
            flutter_target: windows

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libmpv-dev \
            mpv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch & verify pinned LGPL FFmpeg and PDFium binaries
        run: python scripts/fetch_vendor.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Check Rust formatting
        working-directory: core
        run: cargo fmt --all -- --check

      - name: Run Clippy lints
        working-directory: core
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Rust core (release)
        working-directory: core
        run: cargo build --workspace --release

      - name: Run Rust unit tests
        working-directory: core
        run: cargo test --workspace

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate Flutter localization files
        working-directory: app
        run: flutter gen-l10n

      - name: Analyze Flutter app
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Run Flutter widget & unit tests
        working-directory: app
        run: flutter test

      - name: Build Flutter desktop app (${{ matrix.flutter_target }})
        working-directory: app
        run: flutter build ${{ matrix.flutter_target }} --release

      - name: Bundle Rust & vendor libraries into macOS app
        if: runner.os == 'macOS'
        run: |
          APP_BUNDLE="app/build/macos/Build/Products/Release/tool_center.app"
          mkdir -p "${APP_BUNDLE}/Contents/Frameworks" "${APP_BUNDLE}/Contents/Resources"
          cp core/target/release/libbridge.dylib "${APP_BUNDLE}/Contents/Frameworks/"
          VENDOR_MAC=$(ls -d vendor/macos-* | head -n 1)
          cp "${VENDOR_MAC}/pdfium/lib/libpdfium.dylib" "${APP_BUNDLE}/Contents/Frameworks/"
          cp -R "${VENDOR_MAC}/ffmpeg" "${APP_BUNDLE}/Contents/Resources/ffmpeg"
